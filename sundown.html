<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sundown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Inter:wght@400;500;600&display=swap">
<style>
/* Sundown: Golden Hour's clock on its home branch of the atlas. Pole Position -> OutRun (1986): reach the next checkpoint before time runs out.
   Racing's own flow verb: lean into a bend to charge a drift, let go at the exit for a boost (Super Mario Kart's drift; Mario Kart 64's
   mini-turbo). Near misses feed the flow (Burnout, 2001). Look: a 1970s bosozoku night ride, after the mood of BumbleBear's Black Emperor
   (studied from its public description only). The night is the timer: the ride ends at sunrise. */
:root{ color-scheme:dark; --ink:#07060c; --paper:#f4ecdf; --muted:#b9adc4; --accent:#ff3b5c; --neon:#4ff0ff; --gold:#ffd04a; --line:rgba(244,236,223,.16);
  --font-display:'DotGothic16','Courier New',monospace; --font-body:'Inter',system-ui,sans-serif; }
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:var(--font-body);overflow:hidden}
/* phones: fill the whole screen (dynamic viewport, under the notch), no long-press text selection, callout menu, tap flash, pinch or pull-to-refresh (Kellan, iPhone, 2026-11-19) */
html,body{height:100dvh;position:fixed;inset:0;width:100%;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
canvas#c{display:block;width:100%;height:100%;touch-action:none;image-rendering:crisp-edges;image-rendering:pixelated}
.crt{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(0,0,0,.6))}
.top{position:fixed;top:12px;left:16px;right:16px;display:flex;align-items:center;gap:16px;pointer-events:none;text-shadow:0 0 8px rgba(0,0,0,.8)}
.top a,.top button{pointer-events:auto}
body:has(#sheet:not([hidden])) .top a.home, body:has(#sheet:not([hidden])) #infoBtn{display:none}   /* title / lobby and results screens: no Arcade or ? buttons */
.home{color:var(--paper);text-decoration:none;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:rgba(7,6,12,.5)}
.title{font-family:var(--font-display);font-size:22px;color:var(--accent);text-shadow:0 0 10px rgba(255,59,92,.6)}
.land{font-family:var(--font-display);font-size:14px;padding:3px 10px;border:1px solid var(--line);border-radius:4px;background:rgba(7,6,12,.5)}
.spacer{flex:1}
.stat{display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1}.stat span{font-size:12px;opacity:.85}
#kmh{color:var(--neon);text-shadow:0 0 10px rgba(79,240,255,.5)}
.info{width:32px;height:32px;border-radius:4px;border:1px solid var(--line);background:rgba(7,6,12,.5);color:var(--paper);cursor:pointer;font-weight:600}
.next{position:fixed;top:72px;right:16px;font-family:var(--font-display);font-size:14px;color:var(--gold);text-shadow:0 0 8px rgba(0,0,0,.9);pointer-events:none}
.float{position:fixed;transform:translate(-50%,-50%);font-family:var(--font-display);pointer-events:none;animation:rise 1.2s ease-out forwards;text-shadow:0 0 12px currentColor,0 2px 4px #000;white-space:nowrap}
@keyframes rise{from{opacity:0;transform:translate(-50%,-30%) scale(.85)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}to{opacity:0;transform:translate(-50%,-130%)}}
.banner{position:fixed;left:0;right:0;top:20%;display:flex;align-items:center;justify-content:center;gap:16px;pointer-events:none;padding:10px 16px;background:linear-gradient(90deg,transparent,rgba(7,6,12,.8) 18%,rgba(7,6,12,.8) 82%,transparent);border-block:3px solid var(--neon);animation:wipe 3s steps(16) forwards}
.banner.stop{border-color:var(--accent);animation:wipein .6s steps(10) forwards}
@keyframes wipein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.banner .kj{font-family:var(--font-display);font-size:60px;line-height:1;color:var(--neon);text-shadow:0 0 14px currentColor}
.banner.stop .kj{color:var(--accent)}
.banner .nm{display:block;font-family:var(--font-display);font-size:30px}
.banner small{display:block;font-size:14px;color:var(--muted)}
@keyframes wipe{0%{clip-path:inset(0 100% 0 0)}14%{clip-path:inset(0 0 0 0)}82%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
@media (max-width:560px){ .banner .kj{font-size:44px} .banner .nm{font-size:22px} }
.hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;margin:0;font-size:14px;transition:opacity .8s;text-shadow:0 0 8px #000}
/* ---- between rides: the attract screen and the staged results (references noted in the script above startCard). Pixel rules: square corners,
   hard one-colour shadows, DotGothic16 at multiples of 16 px so its dots stay square, no blur. The info sheet still uses the plain .card. */
.sheet{position:fixed;inset:0;display:grid;place-items:center;background:rgba(4,3,8,.62);padding:16px}
.card{position:relative;width:min(460px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;background:repeating-linear-gradient(rgba(255,255,255,.025) 0 1px,transparent 1px 3px),#0b0912;
  border:3px solid var(--accent);box-shadow:0 0 0 3px #000,8px 8px 0 3px #000;padding:22px;display:flex;flex-direction:column;gap:14px;scrollbar-width:thin;scrollbar-color:var(--accent) #0b0912}
.card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.05;color:var(--paper)}
.card h2 small{display:block;font-size:16px;color:var(--accent);margin-top:4px}
.card p{margin:0;color:var(--muted);line-height:1.55}
.keys{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
kbd{font-family:ui-monospace,monospace;font-size:11px;padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:2px;color:var(--paper)}
.q label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;gap:3px}.chips button{flex:1;min-width:0;height:30px;border:2px solid var(--line);border-radius:0;background:#0b0912;color:var(--paper);cursor:pointer;font-size:13px;padding:0}
.chips button[aria-pressed="true"]{background:var(--paper);color:#14080a}
.qa{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
.btn{height:52px;border:3px solid #000;border-radius:0;background:var(--accent);color:#1a0610;font-family:var(--font-display);font-weight:400;font-size:16px;cursor:pointer;box-shadow:4px 4px 0 #000}
.ghost{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* full screen: no card; the night road is the backdrop */
.sheet:has(.fs){padding:0;background:none}
.card:has(>.fs){width:100%;height:100%;max-height:none;border:0;box-shadow:none;background:none;padding:0;gap:0}
body:has(#attract) .top .stat,body:has(#attract) .top .title,body:has(#attract) .top .land,body:has(#attract) .hint,body:has(.fs) .next{visibility:hidden}
/* attract */
.card:has(>.attract){pointer-events:none;overflow:hidden}
.attract{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:58px 16px 14px;
  background:radial-gradient(ellipse 70% 45% at 50% 26%,rgba(4,3,8,.55),transparent 70%),
    linear-gradient(rgba(4,3,8,.5) 0 5%,rgba(4,3,8,.38) 5% 11%,rgba(4,3,8,.26) 11% 18%,rgba(4,3,8,.14) 18% 26%,transparent 26%),
    radial-gradient(ellipse 62% 78% at 50% 88%,transparent 0 58%,rgba(4,3,8,.16) 58% 70%,rgba(4,3,8,.3) 70% 82%,rgba(4,3,8,.44) 82% 94%,rgba(4,3,8,.56) 94%)}
/* the stepped vignette (hard bands, no blur): the sky behind the wordmark and the two street walls step down toward the edges, so the busy roads frame the title
   instead of competing with it; the bottom centre stays clear, the bike is the showcase. PRESS START sits just above the bike, the middle is left to the road. */
.attract>.btn.press{margin-top:auto;margin-bottom:clamp(6px,2.5vh,22px);top:calc(-1 * clamp(0px,6vh,64px))}   /* Kellan 2026-11-22: lifted higher off the bike; a relative offset, so PSTART's room() and scale are unchanged */
@media (max-height:480px){ .attract>.btn.press{top:calc(-1 * clamp(0px,3vh,14px))} }
/* the cabinet's corner legend: FREE PLAY in the HUD's 3x5 caps, as an arcade marks a set-to-free cabinet (true here: no coins, no store, ever) */
.attract>.fplay{position:absolute;right:16px;bottom:14px;line-height:0;padding:5px 6px;background:rgba(7,6,12,.72);box-shadow:inset 0 0 0 1px #3a3350;pointer-events:none!important}
.attract>*{pointer-events:auto}
.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
/* the wordmark keeps its own patch of night (audit #29): the attract ride passes under gantries and bridge towers, and their signs read through the
   logo as text on text; a stepped ellipse of dark (the vignette's hard bands) sits just behind the logo, never over the road or the bike */
.logo-wrap{isolation:isolate}
.logo-wrap::before,.logo-wrap::after{content:"";position:absolute;inset:-22px -56px -14px;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(4,3,8,.66) 0 62%,rgba(4,3,8,.46) 62% 76%,rgba(4,3,8,.26) 76% 89%,transparent 89%)}
/* while a gantry or a tower's beam passes behind it (attractVeil), the patch deepens and widens in four steps, then lifts again */
.logo-wrap::after{inset:-34px -110px -26px;background:radial-gradient(closest-side,rgba(4,3,8,.8) 0 58%,rgba(4,3,8,.6) 58% 72%,rgba(4,3,8,.36) 72% 86%,transparent 86%);opacity:0;transition:opacity .36s steps(4)}
.logo-wrap.veil::after{opacity:1}
/* gamepad players: a pad press can't start Web Audio (not a user activation), so while a pad is connected and the sound is still off, one
   quiet line under the logo says how to get it; it never moves the layout (absolute) and goes once the sound runs */
.sndh{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;white-space:nowrap;font-family:var(--font-display);font-size:12px;line-height:1;color:#c9bfd8;padding:3px 6px 3px 3px;background:rgba(7,6,12,.72);box-shadow:inset 0 0 0 1px #3a3350;text-shadow:1px 1px 0 #000}
.sndh .tabk{font-size:11px;margin-right:6px;background:#3a2f9a}
canvas.logo{display:block;image-rendering:pixelated}
/* title controls: one kit with the HUD (env/hud.js): ink plates with a 1px #3a3350 edge and a 45-degree corner cut, cream 2px rims with a red hard
   shadow, kanji tabs, 3x5 pixel caps, red/gold/cyan stepped stripes. Hardware rules from cabinet panels (Sanwa-style domed push buttons in a dark
   bezel, a lit 1P START lamp, printed instruction strips), the Walkman TPS-L2 (brushed-metal side plate, embossed lettering) and LCD windows. */
img.p3{display:inline-block;image-rendering:pixelated;vertical-align:middle}
.tabk{display:inline-block;font-family:var(--font-display);font-size:13px;line-height:1;padding:2px 4px 1px;color:#f4ecdf;background:#ff3b5c;box-shadow:2px 2px 0 #000}
.tabk.g{background:#ffd04a;color:#07060c}.tabk.n{background:#3a2f9a}
.cab{border:2px solid #000;border-radius:0;background:#1c1628;color:#f4ecdf;cursor:pointer;font-family:var(--font-display);
  box-shadow:inset 2px 2px 0 #5a5072,inset -2px -2px 0 #0a0810,0 0 0 2px #f4ecdf,4px 4px 0 2px #ff3b5c}
.cab:hover{background:#2a2238}
.cab:active{transform:translate(2px,2px);box-shadow:inset 2px 2px 0 #0a0810,inset -2px -2px 0 #3a3350,0 0 0 2px #f4ecdf,2px 2px 0 2px #ff3b5c}
.attract :focus-visible,body:has(#attract) .top :focus-visible{outline:3px solid #ffd04a!important;outline-offset:5px}
body:has(#attract) .top{z-index:2}
body:has(#pause.lobby:not([hidden])) #attract,body:has(#cos) #attract{visibility:hidden}   /* over the title, assists and the garage show the road, not the title's words through their hints */
body:has(#sheet:not([hidden])) .kickb{display:none!important}   /* the touch KICK buttons never sit over a sheet */   /* the Journal button sits above the full-screen title sheet, so a click or a tap reaches it */
body:has(#attract) .home,body:has(#attract) .info{box-shadow:inset 2px 2px 0 #3a3350,inset -2px -2px 0 #000,3px 3px 0 #ff3b5c!important}
.vcol{position:absolute;right:16px;top:64px;writing-mode:vertical-rl;font-family:var(--font-display);font-size:32px;line-height:1;letter-spacing:6px;color:var(--gold);pointer-events:none!important;
  padding:14px 6px 46px;background:rgba(7,6,12,.84);box-shadow:inset 0 0 0 1px #3a3350,inset 3px 0 0 #ff3b5c,4px 4px 0 #000;
  text-shadow:2px 2px 0 #000}   /* on its own ink band the gold needs only the HUD's hard 2px shadow (the old red offset smeared down the column) */
/* the obi: the band down the spine of an 80s record sleeve. Ink, a red rule, gold tategaki, and a small red seal with 夜 at its foot */
.vcol::after{content:"夜";position:absolute;left:50%;bottom:8px;width:28px;height:28px;margin-left:-14px;display:grid;place-items:center;writing-mode:horizontal-tb;font-size:16px;letter-spacing:0;
  color:#fff6ea;background:#c8102a;box-shadow:inset 0 0 0 2px #ff3b4a,2px 2px 0 #000;text-shadow:none}
@media (max-height:600px){ .vcol{display:none} }
/* PRESS START (research/sundown-craft/title-start.md): the event cards' language, not a web button. A 1-bit canvas (PSTART, #startArt) at whole
   device pixels: スタート in Dela Gothic One (keyline, hot shadow, a crack) over PRESS START on the cards' slanted off-white tape, on a slab of hot
   screentone. The canvas overhangs the button by negative margins (set in PSTART.fit), so the button's box, and its gold focus ring
   (.attract :focus-visible), is the lockup itself. */
.btn.press{position:relative;height:auto;display:block;padding:4px;border:0;background:none;box-shadow:none;line-height:0;color:#f4ecdf}
.press canvas{display:block;image-rendering:pixelated}
.stear{position:fixed;z-index:40;pointer-events:none;image-rendering:pixelated}
/* the showroom: the ridden bike itself is the showcase (one bike on screen); a stepped spotlight falls on it and the arrows flank it */
.bikezone{position:relative;align-self:stretch;flex:0 0 auto;margin:0 -16px -14px;pointer-events:none!important}
.bikezone .spot{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:calc(100% + 40px);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
  background:linear-gradient(rgba(255,236,190,0),rgba(255,236,190,.07) 40%,rgba(255,236,190,.13))}
.bikezone .arr{position:absolute;top:50%;width:56px;height:64px;padding:0;display:grid;place-items:center;pointer-events:auto;transform:translateY(-50%);background:none;border:0;box-shadow:none;cursor:pointer}
.bikezone .arr:active{transform:translate(2px,calc(-50% + 2px))}
.bikezone .arr img{width:20px;height:32px;image-rendering:pixelated;margin:0}
/* the arrows are bare gold glyphs; hovered or focused they step out toward where they point, with a gold underline (no box) */
.bikezone .arr::after{content:"";position:absolute;left:18px;right:18px;bottom:6px;height:3px;background:#ffd04a;box-shadow:2px 2px 0 #000;visibility:hidden}
.bikezone .arr:hover::after,.bikezone .arr:focus-visible::after{visibility:visible}
.bikezone .arr[data-step="-1"]:hover img,.bikezone .arr[data-step="-1"]:focus-visible img{animation:arrL .5s steps(1) infinite}
.bikezone .arr[data-step="1"]:hover img,.bikezone .arr[data-step="1"]:focus-visible img{animation:arrR .5s steps(1) infinite}
@keyframes arrL{50%{transform:translateX(-4px)}} @keyframes arrR{50%{transform:translateX(4px)}}
.attract .bikezone .arr:focus-visible{outline:none!important}
.rm .bikezone .arr img,.rm #optBtn img{animation:none!important;transform:none!important}
.lcd{display:flex;justify-content:space-between;gap:12px;align-self:stretch;padding:5px 8px 4px;font-size:13px;line-height:1.2;color:#4ff0ff;text-shadow:1px 1px 0 #0a3a48;
  background:repeating-linear-gradient(rgba(79,240,255,.06) 0 1px,transparent 1px 3px),#081016;border:2px solid #000;box-shadow:inset 2px 2px 0 #02060a,0 1px 0 #f2f4fa}
.lcd em{font-style:normal;color:#ffd04a;text-shadow:1px 1px 0 #3a2a00}
/* results */
.card:has(>.res){overflow-y:auto}
.res{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:56px 20px 24px;cursor:pointer;
  background:repeating-linear-gradient(rgba(0,0,0,.28) 0 1px,transparent 1px 3px),rgba(5,4,10,.9);--tone:#ffb347;--hi:#ffd04a}
.res.caught{--tone:#ff3b5c;--hi:#8ab0ff}
.res[data-stage="3"],.res[data-stage="4"]{cursor:default}
canvas.fx{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.res[data-stage="2"] canvas.fx,.res[data-stage="3"] canvas.fx,.res[data-stage="4"] canvas.fx{display:none}
.st{display:none;position:relative;margin-block:auto;width:min(1000px,100%);flex-direction:column;align-items:center;gap:16px}
.dawn .st1{margin-bottom:34vh}
.res[data-stage="1"] .st1,.res[data-stage="2"] .st2,.res[data-stage="3"] .st3,.res[data-stage="4"] .st4{display:flex}
.btn.skip{position:fixed;right:16px;bottom:16px;height:auto;padding:6px 12px;font-size:13px;background:#14101c;color:var(--muted);border:2px solid #000;box-shadow:3px 3px 0 #000;z-index:2}
.big{font-family:var(--font-display);font-size:128px;line-height:1;color:#fff6ea;letter-spacing:4px;text-shadow:-4px 0 #000,4px 0 #000,0 -4px #000,0 4px #000,4px 4px #000,8px 8px 0 #c0203a,12px 12px 0 #000}
.sub{margin:0;font-family:var(--font-display);font-weight:400;font-size:48px;line-height:1;letter-spacing:12px;color:var(--hi);text-shadow:4px 4px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000}
.caught .sub{color:#fff6ea;text-shadow:4px 4px 0 #1a2a8a,-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000}
.line{margin:0;font-family:var(--font-display);font-size:16px;color:var(--paper);text-align:center;max-width:620px;text-shadow:2px 2px 0 #000;line-height:1.5}
.line .pb{color:var(--hi)}
.seal{width:200px;height:200px;display:grid;place-items:center;background:#e0202e;color:#fff6ea;border:6px solid #fff6ea;outline:6px solid #e0202e;box-shadow:14px 14px 0 #000;
  font-family:var(--font-display);font-size:80px;line-height:1;writing-mode:vertical-rl;letter-spacing:8px;transform:rotate(-8deg);margin-bottom:12px;animation:slam .5s steps(5) both}
@keyframes slam{0%{transform:rotate(-8deg) scale(2.8);opacity:0}20%{opacity:1}100%{transform:rotate(-8deg) scale(1)}}
.rise{animation:rise2 1s steps(8) both}
@keyframes rise2{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
.hdr{display:flex;align-items:baseline;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-family:var(--font-display)}
.hdr b{font-weight:400;font-size:48px;line-height:1;letter-spacing:8px;color:var(--hi);text-shadow:4px 4px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000}
.hdr span{font-size:16px;color:var(--muted);text-shadow:2px 2px 0 #000}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:center;width:100%}
.mapbox{justify-self:center;border:3px solid #000;outline:2px solid var(--tone);box-shadow:10px 10px 0 #000;background:#06050c;max-width:100%}
canvas.map{display:block;max-width:100%;image-rendering:pixelated}
.tape{display:flex;gap:2px;padding:6px;font-family:var(--font-display);font-size:13px;color:var(--paper);background:#06050c;border-top:2px solid #000}
.tape i{font-style:normal;display:flex;align-items:center;padding:0 5px}
.tape .seg{flex:1 1 0;min-width:0;height:20px;display:grid;place-items:center;color:#07060c;overflow:hidden}
.tally{display:flex;flex-direction:column;gap:14px;font-family:var(--font-display);width:100%}
.tally div{display:flex;align-items:baseline;gap:10px;color:var(--muted);font-size:16px;text-transform:uppercase;letter-spacing:2px;text-shadow:2px 2px 0 #000}
.tally.big div{opacity:0;transform:translateX(-16px);transition:opacity .25s steps(3),transform .25s steps(3)}
.tally.big div.on{opacity:1;transform:none}
.tally div::after{content:"";order:1;flex:1;min-width:12px;border-bottom:4px dotted rgba(244,236,223,.22)}
.tally span{order:0}.tally b{order:2;font-weight:400;font-size:48px;line-height:1;color:var(--paper);letter-spacing:2px;text-shadow:4px 4px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000}
.tally small{order:3;font-size:16px;min-width:1.5em}
.tally.small{gap:6px}.tally.small div{font-size:13px}.tally.small b{font-size:32px}.tally.small small{font-size:13px}
/* stage 3: best nights */
.final{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;width:100%;align-items:start}
.side{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.hs{width:100%;border-collapse:collapse;font-family:var(--font-display);font-size:24px;font-variant-numeric:tabular-nums}
.hs th{font-weight:400;font-size:13px;color:var(--muted);text-align:left;padding:0 8px 4px;letter-spacing:2px;text-transform:uppercase}
.hs td{padding:0 8px;line-height:1.3;white-space:nowrap;color:var(--rc,var(--paper));text-shadow:3px 3px 0 #000}
.hs .km{text-align:right}.hs .rd span{font-size:16px}.hs td.dt{font-size:16px}.hs .sty{text-align:right}.hs td.sty{font-size:16px}.hs td.rd{padding-left:14px}   /* headers stay one size (13px); the road column keeps clear of the km figures */
.hs .e{display:inline-block;font-size:13px;line-height:1.2;padding:0 3px;border:2px solid currentColor;vertical-align:4px;text-shadow:none}
.hs tr.me td{background:rgba(255,255,255,.08);animation:mine 1.8s ease-in-out infinite}
.hs tr.me td:first-child{box-shadow:inset 4px 0 0 var(--rc)}
@keyframes mine{50%{background:rgba(255,255,255,.2)}}
.hs tr.empty td{color:rgba(244,236,223,.2);text-shadow:none}
.ini{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:12px;font-family:var(--font-display)}
.ini>span{font-size:13px;color:var(--muted);max-width:240px;line-height:1.5}
.slots{display:flex;gap:8px}
.slot{display:grid;grid-template-rows:22px 58px 22px;width:52px;text-align:center}
.slot button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0}
.slot b{display:grid;place-items:center;font-weight:400;font-size:48px;color:var(--paper);background:#06050c;border:3px solid #000;box-shadow:inset 0 0 0 2px rgba(244,236,223,.15);text-shadow:3px 3px 0 #000;cursor:pointer}
.slot.on b{color:var(--hi);box-shadow:inset 0 0 0 2px var(--hi)}
.checkin{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 22px;width:100%;padding-top:12px;border-top:2px dashed rgba(244,236,223,.15)}
.checkin .q label{font-family:var(--font-display);font-size:13px;color:var(--paper);margin-bottom:5px}
.checkin .chips{gap:2px}.checkin .chips button{height:28px;border:2px solid #000;background:#1a1424;font-family:var(--font-display);color:var(--paper);box-shadow:inset 0 0 0 1px rgba(244,236,223,.18)}
.checkin .chips button[aria-pressed="true"]{background:var(--paper);color:#14080a}
.checkin .qa{font-family:var(--font-display);font-size:11px}
/* the two ways out: same size, same colours, same weight; stopping is never the small print */
.exits{display:grid;grid-template-columns:1fr;gap:18px;width:min(420px,100%);margin:0 auto}
.exits button,.exits .btn{height:auto;min-height:64px;padding:8px 12px;border:3px solid #000;outline:2px solid var(--paper);outline-offset:-7px;background:#14101c;color:var(--paper);font-family:var(--font-display);font-size:16px;letter-spacing:2px;line-height:1.3;cursor:pointer;box-shadow:5px 5px 0 #000;border-radius:0}
.exits button:hover,.exits button:focus-visible{background:var(--paper);color:#14080a;outline-color:#14080a}
.exits button:disabled{cursor:default}
.exits small{display:block;font-size:11px;letter-spacing:1px;opacity:.75}
/* the results in the pause menu's anime language: stage-card slab headers that slam in (kanji in red, the word in the title's chrome ramp),
   name entry as its own screen with slanted letter tiles, your row on the board slams in and a glint crosses it, the ways out are slanted slabs */
.rslab{position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 18px;max-width:100%;padding:14px 44px 16px;font-family:var(--font-display);filter:drop-shadow(6px 6px 0 #000)}
.rslab::before,.rslab::after{content:"";position:absolute;z-index:-1;clip-path:polygon(24px 0,100% 0,calc(100% - 24px) 100%,0 100%)}
.rslab::before{inset:0;background:#0b0912;box-shadow:inset 0 2px 0 #3a3350,inset 0 -2px 0 #3a3350}
.rslab::after{inset:-9px 10px;z-index:-2;background:linear-gradient(#ff2a3a 0 3px,transparent 3px 5px,#ffd04a 5px 6px,transparent 6px calc(100% - 6px),#ffd04a calc(100% - 6px) calc(100% - 5px),transparent calc(100% - 5px) calc(100% - 3px),#ff2a3a calc(100% - 3px))}
.rslab .kj{font-size:48px;line-height:1;color:#ff2a3a;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,4px 4px 0 #000}
.rslab b{font-weight:400;font-size:48px;line-height:1;letter-spacing:6px;color:transparent;background:linear-gradient(#fff 0 18%,#c8eaff 18% 34%,#82bcf0 34% 47%,#3c3c8c 47% 52%,#ffe48a 52% 68%,#ffbc4a 68% 84%,#ff7a3a 84%);
  -webkit-background-clip:text;background-clip:text;filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000) drop-shadow(0 2px 0 #000) drop-shadow(0 -2px 0 #000) drop-shadow(3px 3px 0 #6a0a24)}
.res[data-stage="2"] .st2 .rslab,.res[data-stage="3"] .st3 .rslab,.res[data-stage="4"] .st4 .rslab{animation:pzslam .38s steps(7) both}
.st3 .ini{margin-top:4px}
.st3 .slots{gap:14px}
.res .slot{width:64px;grid-template-rows:26px 72px 26px;filter:drop-shadow(5px 5px 0 #000)}
.res .slot b{font-size:48px;border:0;background:#1c1628;box-shadow:inset 0 3px 0 #5a5072;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.res .slot.on b{color:#14080a;background:#f4ecdf;box-shadow:inset 0 3px 0 #fff,inset 0 -3px 0 #9a94aa;animation:pztab .2s steps(3) both}
.res .slot.on{filter:drop-shadow(5px 5px 0 #ff3b5c)}
.res .slot button{font-size:16px;color:#f4ecdf}
.res .slot.on button{color:#ff3b5c}
.rx.pzi{height:auto;box-shadow:none;width:auto;margin:0;outline:0}
.rx.pzi:disabled{cursor:default}
.st3>.rx{min-width:220px;margin-top:6px}
.rexits{display:grid;grid-template-columns:minmax(0,320px);justify-content:center;gap:14px 26px;width:min(620px,100%);padding:0 34px;margin:6px auto 0}
.rexits .pzi small{display:block;font-size:13px;line-height:1.25;letter-spacing:1px;margin-top:4px;opacity:.8;text-wrap:balance}
/* the ways out never scroll away: on a short or narrow screen they ride the bottom edge over a dark band */
.res[data-stage="4"] .rexits{position:sticky;bottom:0;z-index:2;padding-block:14px 16px;background:linear-gradient(transparent,rgba(5,4,10,.94) 22px)}
.rexits:has(.sel) .pzi:not(.sel){color:#8f86a0}.rexits:has(.sel) .pzi:not(.sel) .tabk{filter:brightness(.62)}.rexits:has(.sel) .pzi:not(.sel)>.bg::after{background:#151020;box-shadow:inset 0 2px 0 #3a3350}
.res[data-stage="4"] .hs tr.me td{background-image:linear-gradient(100deg,transparent 0 44%,rgba(255,255,255,.75) 44% 48%,transparent 48% 51%,rgba(255,255,255,.75) 51% 52%,transparent 52%);background-size:400% 100%;background-repeat:no-repeat;
  animation:rslam .3s steps(4) .3s both,rglint .5s steps(6) .62s both,mine 1.8s ease-in-out 1.2s infinite}
.res[data-stage="4"] .hs tr.me td:nth-child(n+2){animation-delay:.3s,.68s,1.2s}.res[data-stage="4"] .hs tr.me td:nth-child(n+4){animation-delay:.3s,.74s,1.2s}
@keyframes rslam{0%{transform:translateX(-60px);opacity:0;color:#fff}50%{transform:translateX(8px);opacity:1;color:#fff;background-color:rgba(255,255,255,.6)}100%{transform:none}}
@keyframes rglint{from{background-position:110% 0}to{background-position:-10% 0}}
.rm .rslab,.rm .res .slot.on b,.rm .res .hs tr.me td{animation:none!important}
@media (prefers-reduced-motion: reduce){ .rslab,.res .slot.on b,.res .hs tr.me td{animation:none!important} }
@media (max-width:560px){ .rslab{padding:12px 30px 14px} .rslab .kj,.rslab b{font-size:32px;letter-spacing:3px} .rexits{grid-template-columns:1fr;padding:0 24px} .res .slot{width:52px;grid-template-rows:24px 60px 24px} .res .slot b{font-size:32px} }
@media (max-width:880px){ .hero,.final{grid-template-columns:1fr} .side{order:2} .big{font-size:80px} .sub,.hdr b{font-size:32px} .seal{width:140px;height:140px;font-size:56px} .tally b{font-size:32px} }
@media (max-width:560px){ .vcol{display:none}
  .dawn .st1{margin-bottom:24vh} .hs{font-size:16px} .hs td,.hs th{padding:0 3px} .hs .rd span,.hs .dt{display:none}
  .checkin{grid-template-columns:1fr} .exits{grid-template-columns:1fr} .slot{width:44px;grid-template-rows:20px 48px 20px} .slot b{font-size:32px} .res{padding:52px 12px 20px} .big{font-size:64px} }
/* a phone held sideways (844 x 390): the course map and its tally stay side by side and the slabs shrink, so a stage fits the screen (audit #7) */
@media (max-height:480px) and (min-width:600px){ .res{padding:40px 20px 16px} .st{gap:10px} .hero{grid-template-columns:minmax(0,1fr) 260px;gap:24px} .final{grid-template-columns:240px minmax(0,1fr);gap:24px} .side{order:0}
  .rslab{padding:8px 30px 10px} .rslab .kj,.rslab b{font-size:32px;letter-spacing:3px} .tally{gap:6px} .tally div{font-size:13px} .tally b{font-size:28px} .hs{font-size:16px} .hs .rd span{display:none} .big{font-size:80px} }
@media (max-height:640px){ .card:has(>.attract){pointer-events:auto;overflow-y:auto} }
@media (prefers-reduced-motion: reduce){ .hs tr.me td,.seal,.rise{animation:none} .tally.big div{transition:none} }
.mech{display:flex;flex-direction:column;gap:10px}.mech div{font-size:13px;line-height:1.45}.mech small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.pb{color:var(--gold);font-weight:600}
:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
@media (max-width:560px){ .title,.land{display:none} .stat b{font-size:22px} .next{top:64px} }
@media (prefers-reduced-motion: reduce){ .float{animation-duration:.01s} }
/* the reduced-motion setting (pause > settings) can switch the same things off when the system preference is not set */
.rm .hs tr.me td,.rm .seal,.rm .rise{animation:none} .rm .tally.big div{transition:none} .rm .float{animation-duration:.01s}
/* ---- pause: the frozen road under a stepped dark wash, a stage-card slab (一時停止 / PAUSE, drawn like the arrival card and the title wordmark)
   and a cabinet-panel menu in the title's kit: ink plate with a corner cut and the three stripes, bevelled .cab rows, kanji tabs, 3x5 caps. */
.pzb{display:none!important}
@media (pointer:coarse){ .pzb{display:grid!important;place-items:center} }
body:has(#sheet:not([hidden])) .pzb,body.paused .pzb{display:none!important}   /* only during a ride */
.pzb img{width:9px;height:12px;image-rendering:pixelated}
body.paused #c,body.paused #hudx{filter:saturate(.45)}
body.paused .banner,body.paused .float{animation-play-state:paused!important}
#pause{position:fixed;inset:0;z-index:30;display:flex;overflow-y:auto;overflow-x:hidden;padding:16px;
  background:repeating-linear-gradient(rgba(0,0,0,.24) 0 1px,transparent 1px 3px),
    linear-gradient(rgba(4,3,8,.78) 0 5%,rgba(4,3,8,.66) 5% 10%,rgba(4,3,8,.54) 10% 16%,rgba(4,3,8,.44) 16% 84%,rgba(4,3,8,.54) 84% 90%,rgba(4,3,8,.66) 90% 95%,rgba(4,3,8,.78) 95%)}
/* the anime pass: a printed halftone vignette and manga focus lines on a low-res canvas (pzFx), the header slams in on a white impact frame,
   the rows are Persona 5-style slanted slabs that punch in one after another; the chosen one jumps forward with a flick of speed lines, a glint
   and a kanji tab that lands, while the rest recede. Settings arrive behind an ink splash; confirmations are a manga shout bubble.
   Reduced motion: no slams, punches, flicks or splashes, only a short stepped fade. */
#pzFx{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.pzin{position:relative;margin:auto;width:min(720px,100%);display:flex;flex-direction:column;align-items:center;gap:14px}
#pzHead{display:block;image-rendering:pixelated;max-width:100%}
.pzl{align-self:center;width:min(440px,100%);font-family:var(--font-display)}
.pzp{position:relative;width:min(440px,100%);display:flex;flex-direction:column;gap:10px;padding:4px 0 10px 26px}
.pzi{position:relative;isolation:isolate;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:calc(100% - 56px);margin-left:calc(var(--i,0) * 11px);
  min-height:46px;padding:6px 26px 6px 24px;text-align:left;border:0;border-radius:0;background:none;color:#f4ecdf;cursor:pointer;font-family:var(--font-display);font-size:16px;line-height:1;letter-spacing:2px}
.pzi>.sh,.pzi>.bg,.pzi>.gl{position:absolute;inset:0;z-index:-1;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.pzi>.sh{transform:translate(5px,5px);background:#000}
.pzi>.bg{background:#000}
.pzi>.bg::after{content:"";position:absolute;inset:2px 3px;clip-path:polygon(13px 0,100% 0,calc(100% - 13px) 100%,0 100%);background:#1c1628;box-shadow:inset 0 2px 0 #5a5072}
.pzi>.gl{z-index:0;pointer-events:none;opacity:0;background:linear-gradient(100deg,transparent 0 46%,#fff 46% 49%,transparent 49% 52%,#fff 52% 53%,transparent 53%) no-repeat;background-size:300% 100%;background-position:120% 0}
.pzi>.fx{position:absolute;right:100%;top:5px;bottom:5px;width:72px;margin-right:-4px;pointer-events:none;opacity:0;clip-path:polygon(0 30%,100% 0,100% 100%,0 70%);
  background:repeating-linear-gradient(transparent 0 2px,#f4ecdf 2px 4px,transparent 4px 7px,#ff3b5c 7px 8px,transparent 8px 11px)}
.pzi .t,.pzi .tabk,.pzi .sw,.pzi .vb{position:relative;z-index:1}
.pzi .tabk{box-shadow:2px 2px 0 #000}
.pzi:focus-visible{outline:none!important}
.pzi .mk{position:absolute;left:-30px;top:50%;width:20px;height:28px;margin-top:-14px;background:center/20px 28px no-repeat;image-rendering:pixelated;visibility:hidden}
.pzi.sel{transform:translateX(12px);color:#14080a}
.pzi.sel .mk{visibility:visible;animation:pzbob .5s steps(1) infinite}
.pzi.sel>.bg::after{background:#f4ecdf;box-shadow:inset 0 2px 0 #fff,inset 0 -2px 0 #9a94aa}
.pzi.sel>.sh{background:#ff3b5c}
.pzi.sel>.gl{animation:pzglint .42s steps(7) .04s both}
.pzi.sel>.fx{animation:pzflick .26s steps(4) both}
.pzi.sel .tabk{animation:pztab .24s steps(3) both;box-shadow:3px 3px 0 #000}
.pzp:has(.sel) .pzi:not(.sel){color:#8f86a0}.pzp:has(.sel) .pzi:not(.sel) .tabk{filter:brightness(.62)}.pzp:has(.sel) .pzi:not(.sel)>.bg::after{background:#151020;box-shadow:inset 0 2px 0 #3a3350}   /* the rest recede */
.pzi:active{transform:translate(14px,2px)}
@keyframes pzbob{50%{transform:translateX(-4px)}}
@keyframes pzglint{from{opacity:1;background-position:120% 0}to{opacity:1;background-position:-20% 0}}
@keyframes pzflick{0%{opacity:1;transform:translateX(36px)}60%{opacity:1}100%{opacity:0;transform:translateX(-20px)}}
@keyframes pztab{0%{transform:translate(-6px,-8px);box-shadow:9px 11px 0 #000}100%{transform:none}}
/* the shout bubble: a jagged burst (its points are set from pzBurst), ink outline, red hard shadow */
.pzc{display:flex;flex-direction:column;gap:14px;padding:2px 0 4px}
.bub{position:relative;isolation:isolate;align-self:flex-start;max-width:calc(100% - 40px);padding:22px 34px 24px;color:#07060c;font-family:var(--font-display);text-align:center;filter:drop-shadow(5px 5px 0 #ff3b5c)}
.bub::before,.bub::after{content:"";position:absolute;z-index:-1;clip-path:var(--burst)}
.bub::before{inset:0;background:#000}
.bub::after{inset:3px;background:#fff6ea}
.bub b{display:block;font-weight:400;font-size:32px;line-height:1;letter-spacing:2px}
.bub small{display:block;margin-top:8px;font-size:13px;line-height:1.35;color:#3a3348}
.pzc2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-right:24px}
.pzc2 .pzi{width:auto;margin-left:0;grid-template-columns:minmax(0,1fr);font-size:13px;letter-spacing:1px;padding:6px 18px}
.pzc2 .pzi .mk{display:none}
.pzc2 .pzi.sel{transform:translateY(-3px)}
.pzi .sw{display:flex;gap:2px;font-size:13px}
.pzi .sw i{font-style:normal;padding:3px 6px 2px;border:2px solid currentColor;opacity:.45}
.pzi .sw i.on{opacity:1;background:#ff3b5c;border-color:#000;color:#f4ecdf}
.pzi .vb{display:flex;align-items:flex-end;gap:2px;height:22px}
.pzi .vb i{display:block;width:6px;background:#3a3350;box-shadow:inset 0 0 0 1px #000;cursor:pointer}
.pzi .vb i.on{background:#4ff0ff}.pzi .vb i.on.g{background:#ffd04a}.pzi .vb i.on.r{background:#ff3b5c}
.pzi .vb b{font-weight:400;font-size:16px;min-width:2ch;text-align:right;margin-left:6px;align-self:center}
.pzsp{position:absolute;left:50%;top:50%;width:440px;height:440px;margin:-220px 0 0 -220px;z-index:3;pointer-events:none;background:center/100% 100% no-repeat;image-rendering:pixelated;animation:pzsplash .5s steps(6) both}
#pause.in #pzHead{animation:pzslam .38s steps(7) both}
#pause.in .pzl{animation:pzup .2s steps(4) .1s both}
.pzp.punch .pzi{animation:pzpunch .2s steps(3) calc(var(--i,0) * 45ms + 90ms) backwards}
.pzp.punch .bub{animation:pzpop .24s steps(4) backwards}
@keyframes pzslam{0%{transform:scale(2.4);opacity:0;filter:brightness(0) invert(1)}28%{transform:scale(.94);opacity:1;filter:brightness(0) invert(1)}42%{transform:scale(1.04);filter:none}
  57%{transform:translate(-4px,3px)}71%{transform:translate(3px,-2px)}86%{transform:translate(-1px,1px)}100%{transform:none}}
@keyframes pzup{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes pzpunch{0%{transform:translateX(-80px);opacity:0}66%{transform:translateX(10px);opacity:1}100%{transform:none}}
@keyframes pzpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:none}}
@keyframes pzsplash{0%{transform:scale(.2);opacity:1}35%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes pzfade{from{opacity:0}to{opacity:1}}
.rm #pause *{animation:none!important}

/* assists and remap: the pause menu's rows with a value on the right; the remap row shows key caps and the pad button */
.pzhint{margin:0 0 2px;font-family:var(--font-display);font-size:13px;line-height:1.5;color:var(--muted);text-shadow:2px 2px 0 #000;padding-right:30px}
.pzhint b{font-weight:400;color:#ffd04a}
.pznote{min-height:3em;color:#ffd04a;margin-top:-2px}
.pzi .vv{position:relative;z-index:1;font-size:13px;letter-spacing:1px;white-space:nowrap}
.pzi .kk{position:relative;z-index:1;display:flex;gap:4px;align-items:center}
.pzi .kk kbd{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 5px 1px;font-family:var(--font-display);font-size:13px;line-height:1;color:#1a1424;border-radius:0;background:#e6e2ec;border:2px solid #000;box-shadow:inset 1px 1px 0 #fff,inset -1px -2px 0 #9a94aa}
.pzi .kk kbd.alt{opacity:.7}.pzi .kk kbd.pd{background:#3a2f9a;color:#f4ecdf;box-shadow:inset 1px 1px 0 #6a5ad0,inset -1px -2px 0 #1a1460}
.pzi.wait .kk kbd:not(.pd){background:#ffd04a}
.pzi.wait>.sh{background:#ffd04a}
.pzalt{display:none}
/* the title's options button, top right: the title kit's bevelled .cab plate, a gold 設定 tab, OPTIONS in the display face and a pixel gear */
#optBtn{position:absolute;top:12px;right:16px;z-index:2;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 10px 0 8px;font-size:16px;line-height:1;letter-spacing:2px}
#optBtn img{width:22px;height:22px;image-rendering:pixelated}
#optBtn .nw,.pzi .nw{position:relative;z-index:1;font-size:13px;line-height:1;padding:2px 4px 1px;background:#ff3b5c;color:#fff6ea;box-shadow:2px 2px 0 #000;letter-spacing:0}
#optBtn:hover img{transform:rotate(45deg)}.rm #optBtn:hover img{transform:none}
@media (max-width:560px){ #optBtn .t{display:none} #optBtn{padding:0 8px} }
@media (hover:hover) and (pointer:fine){ #optBtn{display:none} }   /* Kellan 2026-11-22: mouse/keyboard players open options with Esc (pad: Start); the button stays only on touch screens, which have no Esc */
/* input prompts under the menus and the name entry: the HUD's keycaps, named for the last input used (keys or pad); touch needs none */
.ukeys{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;margin:0;font-family:var(--font-display);font-size:13px;line-height:1;color:var(--muted);text-shadow:2px 2px 0 #000;text-transform:uppercase;letter-spacing:1px}
.ukeys span{display:inline-flex;align-items:center;gap:6px}
.ukeys kbd{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 4px 1px;font-family:var(--font-display);font-size:13px;line-height:1;letter-spacing:0;color:#1a1424;text-shadow:none;border-radius:0;background:#e6e2ec;border:2px solid #000;box-shadow:inset 1px 1px 0 #fff,inset -1px -2px 0 #9a94aa;margin:0}
.ukeys kbd.pd{background:#3a2f9a;color:#f4ecdf;box-shadow:inset 1px 1px 0 #6a5ad0,inset -1px -2px 0 #1a1460}
#pzKeys{margin-top:2px;padding:6px 12px;background:rgba(7,6,12,.82);box-shadow:inset 0 0 0 1px #3a3350,4px 4px 0 #000}   /* a printed strip, like the title's, so it reads over the bike */
#pause.lobby{background:repeating-linear-gradient(rgba(0,0,0,.24) 0 1px,transparent 1px 3px),rgba(4,3,8,.88)}   /* from the title: the logo and tagline must not read through the hints */
#pause.lobby .pzalt{display:flex}#pause.lobby #pzHead{display:none}#pause.lobby.in .pzalt{animation:pzslam .38s steps(7) both}
@media (max-width:560px){ .pzi .kk kbd.alt{display:none} .pzi .vv{font-size:11px} }
.rm #pause.in .pzin{animation:pzfade .2s steps(4) both!important}
@media (prefers-reduced-motion: reduce){ #pause *{animation:none!important} #pause.in .pzin{animation:pzfade .2s steps(4) both!important} }
.pzi .t{line-height:1.2}
@media (max-width:560px){ .pzp{padding-left:22px} .pzi{gap:8px;letter-spacing:1px;padding:6px 20px;width:calc(100% - 30px - var(--i,0) * 4px);margin-left:calc(var(--i,0) * 4px)} .pzi .mk{left:-26px} .bub{padding:18px 26px 20px} .pzc2{padding-right:12px} }
/* ---- the loader: up from the first paint (no script needed), over everything, until the night is built and the title is composed under it.
   A title card in the house manner of the job cut-ins (research/sundown-craft/loading.md): three colours only (ink, hot, off-white),
   1-bit pixels on an integer scale --s. Jo: ink, a hot hairline drawn across, a held beat. Ha: two brush strokes whip in as drawn smear
   frames (Kanada spacing: a held first drawing, then long jumps, then the snap) and land as the hot band; the kaido racer (bike only) is
   one ink silhouette cut out of it, rim-lit off-white (a 1980s sports bike, traced from a real GSX-R750J); a third stroke curls on over the left
   and resolves into 夜露死苦 set as the avalanche card sets 雪崩: Dela Gothic One at the card's scale (52 art px a glyph, ~27% of the
   height), a seal-order 2x2 block (right column first), pre-rendered to 1 bit with an ink keyline, a hot offset shadow and the card's
   shatter (seams down the gaps, one crack across, shards nudged), on a slanted screentone panel; a YOROSHIKU tape in Dela and the
   card's 3x5 caption face. Hold, at any length: tail-light streaks through the band, the band's
   dithered edge shimmers, a streetlight glint steps along the bike's rim. Kyu (.out): the bike bolts out right in four steps, the band wipes off
   along the stroke and the title's neon strikes on in the dark. Every move is a stepped transform or opacity (compositor only: each step is a held keyframe on a linear timing, never steps(), which WebKit
   will not hand to Core Animation; and no transitions, clip-path, filter or background-position move), so it
   keeps running while boot() holds the main thread. The plate: one honest riding tip (心得), two lines of small Dela, and a thin 24-cell meter that
   moves only on real steps. Reduced motion: no strokes, the resolved card, only the meter moves. */
#loader{--s:2px;--t:1;position:fixed;inset:0;z-index:80;overflow:hidden;background:#0a0810}
@media (min-height:700px) and (min-width:380px){ #loader{--s:2px} }
@media (min-width:900px) and (min-height:520px){ #loader{--s:3px} }
@media (min-width:1000px) and (min-height:640px){ #loader{--t:2} }
@media (min-width:1200px) and (min-height:640px){ #loader{--s:4px} }
@media (min-width:1500px) and (min-height:860px){ #loader{--s:5px} }
@media (min-width:2100px) and (min-height:1180px){ #loader{--s:7px;--t:3} }
#loader.out{opacity:0;pointer-events:none;animation:ldout .28s linear both}
#loader i,#loader b{display:block;position:absolute;image-rendering:pixelated;background-repeat:no-repeat}
#loader .ldst{left:50%;top:44%;width:calc(var(--s) * 184);height:calc(var(--s) * 100);margin:calc(var(--s) * -50) 0 0 calc(var(--s) * -76)}

/* portrait phones: compose vertically. A tall slab fills the middle ~55% of the height; 夜露死苦 straddles its top edge at the left
   on its panel, the tape above at the right, the bike on the slab's floor; the smears stretch with the slab. 390x844-class phones:
   the block, its stroke and panel at 3 device px per art px, as the bike is there */
@media (orientation:portrait) and (max-width:560px){
  #loader .ldst{top:20%;margin:0 0 0 calc(var(--s) * -92)}
  #loader .ldbw{height:calc(55vh + var(--s) * 8)}
  #loader .ldx{height:calc(55vh - var(--s) * 0)}

  #loader .ldk.c{top:calc(55vh - var(--s) * 20)}
}
@media (orientation:portrait) and (min-width:380px) and (max-width:560px) and (min-height:800px){
  #loader .ldbw{height:calc(61vh + var(--s) * 8)}
  #loader .ldx{height:61vh}
  #loader .lds.a,#loader .lds.b{height:calc(61vh + var(--s) * 20)}
  #loader .ldkj,#loader .lds.c{width:348px;height:300px;top:calc(var(--s) * -20 - 4px)}
  #loader .ldpn{left:calc(var(--s) * 92 - 50vw + 6px - 42px);top:calc(var(--s) * -20 - 10px);width:408px;height:300px}

window.BOOT = (() => { const el = document.getElementById('loader'), cells = el ? [...el.querySelectorAll('.ldbar i')] : [], lab = el && el.querySelector('.ldlab');
  let got = 0, expect = 40, done = 0, total = 0, lit = -1, last = performance.now();
  const paint = () => { const f = .2 * Math.min(1, got / expect) + (total ? .8 * Math.min(1, done / total) : 0), n = Math.round(f * cells.length); last = performance.now();
    if(n !== lit){ lit = n; cells.forEach((c, i) => c.classList.toggle('on', i < n)); } };
  document.addEventListener('load', e => { if(e.target && e.target.tagName === 'SCRIPT'){ got++; paint(); } }, true);
  const B = { expect(n){ expect = Math.max(1, n); paint(); }, add(n){ total += n; paint(); }, label(t){ if(lab && t) lab.textContent = t; }, step(){ done++; paint(); },
    done(instant){ clearInterval(B.dog); if(!el || el.hidden) return; cells.forEach(c => c.classList.add('on')); if(instant){ el.hidden = true; return; } el.classList.add('out'); setTimeout(() => { if(el.classList.contains('out')) el.hidden = true; }, 320); },
    again(n){ if(!el) return; got = expect; done = 0; total = n; lit = -1; el.classList.remove('out'); el.hidden = false; paint(); B.dog = setInterval(() => { if(performance.now() - last > 20000) B.done(); }, 2000); } };   /* START before the night is fully built: the loader comes back for the rest */
  try{ B.font = document.fonts && (!/HeadlessChrome/.test(navigator.userAgent) || /boot=async/.test(location.search)) ? document.fonts.load('16px DotGothic16', 'SUNDOWN夜走スタート日没から夜明けまで設定改造補助手帖戻る').catch(() => {}) : null; }catch(e){}   /* the title's glyphs start downloading now, beside the scripts */
  if(el) el.style.setProperty('--tip', String(Math.floor(Math.random() * 4)));   /* one honest riding tip (心得) per load, from the four drawn in the loader's tip strip */
  B.dog = setInterval(() => { if(performance.now() - last > 20000) B.done(); }, 2000);   /* a boot that stops moving for 20 s (a script error) never leaves the page covered */
  return B; })();
